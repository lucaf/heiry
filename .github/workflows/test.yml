name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test documentation checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check documentation and local links
        run: python3 scripts/check_docs.py
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.27.1', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Package tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
